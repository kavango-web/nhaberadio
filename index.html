<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavango Radio | Live Stream</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #030712 !important;
            color: #f8fafc !important;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased selection:bg-rose-500 selection:text-white">

    <!-- Container Card -->
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6 relative overflow-hidden">
        
        <!-- Glow accents -->
        <div class="absolute -right-20 -bottom-20 w-60 h-60 bg-rose-600/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -left-20 -top-20 w-60 h-60 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="flex items-center justify-between z-10 relative">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-lg">
                    <i class="fa-solid fa-radio"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight text-white">KAVANGO RADIO</h1>
                </div>
            </div>
            <span id="connection-status-badge" class="flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ONLINE
            </span>
        </div>

        <!-- Track Cover & Metadata -->
        <div class="flex flex-col items-center text-center space-y-3 z-10 relative">
            <div class="relative group w-36 h-36">
                <img id="listener-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=80" alt="Cover" class="w-full h-full object-cover rounded-2xl shadow-xl border border-slate-700/50">
                <div class="absolute inset-0 bg-black/40 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                    <i class="fa-solid fa-compact-disc text-3xl text-white animate-spin" style="animation-duration: 8s;"></i>
                </div>
            </div>
            <div>
                <h2 id="listener-title" class="text-lg font-extrabold text-white tracking-tight">Kavango Radio Broadcast</h2>
                <p id="listener-artist" class="text-xs font-semibold text-rose-400 truncate max-w-[280px]">Loading metadata...</p>
            </div>
        </div>

        <!-- Direct Stream URL Controls -->
        <div class="w-full bg-slate-950 rounded-2xl border border-slate-800 p-4 space-y-4 z-10 relative shadow-inner">
            <div class="flex items-center justify-between">
                <div class="text-xs font-bold text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-tower-broadcast text-rose-500 animate-pulse"></i> Secure HTTPS Feed
                </div>
                <span id="player-state-badge" class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/20 font-mono">LIVE MP3</span>
            </div>

            <!-- Custom Built Player around native audio engine -->
            <div class="space-y-4 py-2" id="player-container">
                <!-- Direct HTML5 Audio element -->
                <audio id="audio_1" preload="none" class="hidden">
                    <source src="https://louise-professor-sodium-james.trycloudflare.com/stream" type="audio/mpeg">
                </audio>

                <!-- Custom High-Tech Play/Pause Control -->
                <div class="flex flex-col items-center justify-center space-y-3 py-2">
                    <button id="custom-play-btn" onclick="toggleAudio()" class="w-16 h-16 rounded-full bg-gradient-to-tr from-rose-500 to-indigo-600 hover:from-rose-600 hover:to-indigo-700 text-white flex items-center justify-center text-2xl shadow-xl shadow-rose-500/25 transition-all hover:scale-105 active:scale-95 cursor-pointer">
                        <i id="play-icon" class="fa-solid fa-play ml-1"></i>
                    </button>
                    <span id="status-text" class="text-xs font-semibold text-slate-400">Click to Play Live Broadcast</span>
                </div>

                <!-- Volume Slider -->
                <div class="flex items-center gap-3 px-4 py-2 bg-slate-900 rounded-xl border border-slate-800">
                    <i class="fa-solid fa-volume-high text-xs text-slate-400"></i>
                    <input type="range" id="volume-control" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-rose-500">
                </div>
            </div>
        </div>

        <!-- Audio Visualizer Canvas -->
        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2 z-10 relative">
            <div class="flex items-center justify-between text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                <span>Signal Visualizer</span>
                <span id="visualizer-status" class="text-emerald-400 font-mono">Stream Active</span>
            </div>
            <div class="h-12 w-full bg-slate-900 rounded-xl overflow-hidden p-1">
                <canvas id="listener-canvas" class="w-full h-full"></canvas>
            </div>
        </div>

    </div>

    <script>
        let audio, playBtn, playIcon, statusText, listenerTitle, listenerArtist;
        let isPlayPending = false;
        let visualizerAnimFrame = null;

        const STREAM_URLS = [
            "https://louise-professor-sodium-james.trycloudflare.com/stream",
            "https://eu4.fastcast4u.com/proxy/veleskatti?mp=/1"
        ];
        let currentStreamIdx = 0;

        function initAudioEngine() {
            audio = document.getElementById('audio_1');
            playBtn = document.getElementById('custom-play-btn');
            playIcon = document.getElementById('play-icon');
            statusText = document.getElementById('status-text');
            listenerTitle = document.getElementById('listener-title');
            listenerArtist = document.getElementById('listener-artist');

            if (audio) {
                if (!audio.src) {
                    audio.src = STREAM_URLS[currentStreamIdx];
                }

                audio.onerror = (e) => {
                    console.warn("Audio stream error, trying fallback source...", e);
                    currentStreamIdx = (currentStreamIdx + 1) % STREAM_URLS.length;
                    audio.src = STREAM_URLS[currentStreamIdx];
                    audio.play().catch(err => console.error("Fallback play error:", err));
                };
            }
            
            fetchMetadata();
            setInterval(fetchMetadata, 10000);
        }

        async function fetchMetadata() {
            try {
                const res = await fetch("https://louise-professor-sodium-james.trycloudflare.com/stats?json=1");
                if (res.ok) {
                    const data = await res.json();
                    let title = "Kavango Radio Broadcast";
                    let artist = "Live Stream";
                    
                    if (data.icestats && data.icestats.source) {
                        let sources = Array.isArray(data.icestats.source) ? data.icestats.source : [data.icestats.source];
                        let activeSource = sources.find(s => s.listenurl && s.listenurl.includes("/stream")) || sources[0];
                        if (activeSource && activeSource.title) {
                            title = activeSource.title;
                        }
                        if (activeSource && activeSource.artist) {
                            artist = activeSource.artist;
                        } else if (activeSource && activeSource.server_name) {
                            artist = activeSource.server_name;
                        }
                    }
                    if (listenerTitle) listenerTitle.innerText = title;
                    if (listenerArtist) listenerArtist.innerText = artist;
                }
            } catch (err) {
                console.log("Metadata check silent pass.");
            }
        }

        async function toggleAudio() {
            if (!audio) initAudioEngine();
            if (isPlayPending) return;

            if (audio.paused) {
                try {
                    isPlayPending = true;
                    statusText.innerText = "Connecting live audio stream...";
                    statusText.className = "text-xs font-semibold text-amber-400 animate-pulse";

                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        await playPromise;
                    }
                } catch (err) {
                    console.warn("Playback warning (benign live buffer event):", err);
                    // If audio is actually playing despite the promise warning, ignore error!
                    if (audio.paused) {
                        statusText.innerText = "Stream offline or blocked. Check connection.";
                        statusText.className = "text-xs font-semibold text-rose-400";
                        stopVisualizer();
                        isPlayPending = false;
                        return;
                    }
                } finally {
                    isPlayPending = false;
                }

                playIcon.className = "fa-solid fa-pause ml-0";
                statusText.innerText = "Broadcasting Live";
                statusText.className = "text-xs font-semibold text-emerald-400 animate-pulse";
                startSimulatedVisualizer();
            } else {
                audio.pause();
                playIcon.className = "fa-solid fa-play ml-1";
                statusText.innerText = "Paused";
                statusText.className = "text-xs font-semibold text-slate-400";
                stopVisualizer();
            }
        }

        function setVolume(val) {
            if (!audio) initAudioEngine();
            if (audio) {
                audio.volume = parseFloat(val);
            }
        }

        function startSimulatedVisualizer() {
            const canvas = document.getElementById('listener-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            function renderBars() {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const numBars = 32;
                const barWidth = canvas.width / numBars;

                for (let i = 0; i < numBars; i++) {
                    const barHeight = Math.random() * canvas.height * (audio && !audio.paused ? 0.9 : 0.1);
                    ctx.fillStyle = '#f43f5e';
                    ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 2, barHeight);
                }
                
                if (audio && !audio.paused) {
                    visualizerAnimFrame = requestAnimationFrame(renderBars);
                }
            }
            if (visualizerAnimFrame) cancelAnimationFrame(visualizerAnimFrame);
            renderBars();
        }

        function stopVisualizer() {
            if (visualizerAnimFrame) cancelAnimationFrame(visualizerAnimFrame);
            const canvas = document.getElementById('listener-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        window.toggleAudio = toggleAudio;
        window.setVolume = setVolume;

        window.addEventListener('DOMContentLoaded', () => {
            initAudioEngine();
        });
    </script>
</body>
</html>
